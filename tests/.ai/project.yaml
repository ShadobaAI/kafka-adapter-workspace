schema_version: "0.2"
profile_id: generic-1c
profile_version: 0.2.0
project:
  id: tests
  adapter: generic-1c
  purpose: UI- и модульные тесты адаптера Kafka на Vanessa Automation и YAxUnit
repositories:
  - id: ui
    path: ui
    alias: kfk-ui
  - id: base
    path: unit/base
    alias: kfk-test-base
    edt_project: BaseKafka
  - id: examples
    path: unit/examples
    alias: kfk-test-examples
    edt_project: base.TestAdapterKafka
  - id: unit
    path: unit/unit
    alias: kfk-unit
    edt_project: YAxUnit
  - id: yaxunit
    path: unit/yaxunit
    alias: kfk-yaxunit
    edt_project: yaxunit
roots:
  source:
    - unit/base/src
    - unit/examples/src
    - unit/unit/src
    - unit/yaxunit/exts/yaxunit/src
  protected:
    - unit/base/src
    - unit/examples/src
    - unit/unit/src
    - unit/yaxunit/exts/yaxunit/src
authorities:
  edt_writer: edt
  code_index: code-index
  bsl_ls: bsl-ls
  v8std: v8std
policy:
  mode: conservative
  edt_repository_ids:
    - base
    - examples
    - unit
    - yaxunit
  unbound_edt_repositories:
    - ui
testing:
  commands: []
  yaxunit: true
  vanessa: true
  yaxunit_config:
    repository_id: unit
    framework_repository_id: yaxunit
    product_repository_ids:
      - base
      - examples
    runner: edt
    results: unit/unit/allure
    launch_configuration: base Тонкий клиент
  vanessa_config:
    repository_id: ui
    runtime_profile: ui/.vanessa/profile.json
    features: ui/features
    results: ui/.vanessa/results
    server_name: vanessa
knowledge:
  mode: transitional
  provider: openviking
  manifest: null
  collections:
    - kafka-adapter-docs
  collection_uris:
    kafka-adapter-docs: viking://resources/kafka-git/kafka-adapter/docs
  required: false
  dependent_actions: []
compatibility:
  core: ">=0.1.0"
connections:
  edt:
    url: http://127.0.0.1:8768/mcp
  v8std:
    url: http://127.0.0.1:8766/mcp
  openviking:
    enabled: true
    url: http://127.0.0.1:1933
components:
  code-index:
    enabled: true
  bsl-ls:
    enabled: true
