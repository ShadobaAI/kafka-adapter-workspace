schema_version: "0.2"
profile_id: generic-1c
profile_version: 0.2.0
project:
  id: unit
  adapter: generic-1c
  purpose: Модульные тесты адаптера Kafka на YAxUnit
repositories:
  - id: unit
    path: unit
    alias: kfk-unit
    edt_project: YAxUnit
  - id: yaxunit
    path: yaxunit
    alias: kfk-yaxunit
    edt_project: yaxunit
roots:
  source:
    - base/src
    - examples/src
    - unit/src
    - yaxunit/exts/yaxunit/src
  protected:
    - base/src
    - examples/src
    - unit/src
    - yaxunit/exts/yaxunit/src
authorities:
  edt_writer: edt
  code_index: code-index
  bsl_ls: bsl-ls
  v8std: v8std
policy:
  mode: conservative
  edt_repository_ids:
    - unit
    - yaxunit
testing:
  commands: []
  yaxunit: true
  vanessa: false
  yaxunit_config:
    repository_id: unit
    framework_repository_id: yaxunit
    runner: edt
    results: unit/allure
    launch_configuration: base Тонкий клиент
knowledge:
  mode: transitional
  provider: openviking
  manifest: null
  collections:
    - kafka-adapter-docs
  collection_uris:
    kafka-adapter-docs: viking://resources/kafka-git/kafka-adapter/docs
  required: false
  dependent_actions: []
compatibility:
  core: ">=0.1.0"
connections:
  edt:
    url: http://127.0.0.1:8768/mcp
  v8std:
    url: http://127.0.0.1:8766/mcp
  openviking:
    enabled: true
    url: http://127.0.0.1:1933
components:
  code-index:
    enabled: true
  bsl-ls:
    enabled: true
